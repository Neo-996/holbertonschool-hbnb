<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HBnB - Add Review</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="icon" href="images/icon.png" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html"><img src="images/logo.png" alt="HBnB Logo" class="logo" /></a>
        <a href="login.html" class="login-button">Login</a>
      </nav>
    </header>

    <main>
      <section class="add-review">
        <h1>Add a Review</h1>
        <form class="form" id="review-form">
          <label for="rating">Rating (1–5):</label>
          <select id="rating" name="rating" required>
            <option value="">-- Select --</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>

          <label for="comment">Comment:</label>
          <textarea id="comment" name="comment" rows="4" required></textarea>

          <button type="submit">Submit Review</button>
        </form>

        <p><a href="place.html" id="back-to-place">← Back to Place</a></p>
      </section>
    </main>

    <footer>
      <p>&copy; 2025 HBnB. All rights reserved.</p>
    </footer>

    <script src="scripts/add_review.js"></script>
  </body>
</html>
